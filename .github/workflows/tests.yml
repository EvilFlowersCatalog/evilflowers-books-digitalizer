name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:
  # docker.yml calls it before a deploy: a red suite never reaches dev k3s
  workflow_call:

concurrency:
  # github.workflow is the CALLER's name when called, so this run and docker.yml's call of it
  # never cancel each other
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-image:
    name: SPA image stage
    # The Dockerfile's frontend stage alone, so a broken pnpm install fails in review
    # instead of on master (#10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the frontend stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    # Advisory: surfaces ruff/format/mypy findings without blocking merges on
    # pre-existing debt. Drop `continue-on-error` once the tree is clean to make
    # these checks required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install --no-interaction --only main,dev
      - name: Ruff (lint)
        run: poetry run ruff check evilflowers_books_digitalizer tests
      - name: Ruff (format check)
        run: poetry run ruff format --check evilflowers_books_digitalizer tests
      - name: mypy
        run: poetry run mypy evilflowers_books_digitalizer

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - run: poetry install --no-interaction --only main,dev
      - name: Run tests with coverage
        run: >-
          poetry run pytest
          --cov --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml
      - name: Coverage summary
        if: ${{ always() }}
        run: |
          echo "## Coverage (py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore
