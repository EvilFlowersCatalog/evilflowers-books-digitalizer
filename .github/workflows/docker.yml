name: Docker

# Build the portal image (API + orchestrator, evilflowers-books-digitalizer#6: no OCR, cleaning or
# rendering toolchain), push it to GHCR and roll it out on dev k3s.
#
#   push to develop        → tests, build, push :develop :sha-<short>, deploy to namespace digitalizer
#   push to master / main  → build, push :master / :main :sha-<short>; no deploy (production is not on
#                            k3s yet: knowledge Proposals/CI-Deploy-Unification)
#   tag v*                 → build, push :X.Y.Z :X.Y :sha-<short>
#   pull request           → build only (no push)
#   manual                 → as a push of the chosen ref
#
# Deploy (knowledge Cookbooks/Deploy-a-Service §4, Cookbooks/CI-Runner): the dev overlay pins
# :develop with imagePullPolicy Always, so a new image goes live with a rollout restart. The
# `deploy` job does that on the self-hosted runner INSIDE k3s (runs-on: elvira-k3s), whose
# ServiceAccount arc-deployer may restart Deployments only in the namespaces listed in
# `github_runner_deploy_namespaces` (knowledge roles/github_runner). It restarts every Deployment
# labelled elvira.stuba.sk/image=evilflowers-books-digitalizer (portal, orchestrator), waits for the
# rollouts, then fails unless every running pod — containers and the `migrate` init container —
# uses the digest just pushed. A push never changes a pod's env or the manifests: those are the
# Ansible role's (knowledge#66).

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "poetry.lock"
      - "evilflowers_books_digitalizer/**"
      - "frontend/**"
      - "configs/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "poetry.lock"
      - "evilflowers_books_digitalizer/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/evilflowerscatalog/evilflowers-books-digitalizer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Only log in / push for non-PR events (PRs from forks have no push rights).
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # service.version on every span (studio/telemetry.py reads IMAGE_TAG)
          build-args: |
            IMAGE_TAG=${{ github.ref_name }}@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The test suite gates the deploy: a red develop push builds its image but never rolls it out.
  tests:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: [build, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: elvira-k3s            # ARC scale set in k3s (knowledge roles/github_runner)
    environment:
      name: development
      url: http://portal.digitalizer.stu.k8s.internal
    concurrency:
      group: deploy-digitalizer-dev
      cancel-in-progress: false
    permissions: {}
    env:
      NAMESPACE: digitalizer
      SELECTOR: elvira.stuba.sk/image=evilflowers-books-digitalizer
      DIGEST: ${{ needs.build.outputs.digest }}
      TIMEOUT: 600s                # the migrate init container runs first; Recreate strategy
      KUBECTL_VERSION: v1.31.5     # = the cluster (k3s v1.31.5+k3s1)
      KUBECTL_SHA256: fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af   # dl.k8s.io …/linux/amd64/kubectl.sha256
    steps:
      # The runner image has no kubectl. The pod is deleted after the job, so nothing is cached.
      - name: kubectl ${{ env.KUBECTL_VERSION }} (checksum-pinned)
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # In-cluster credentials: the pod's ServiceAccount arc-deployer.
      - name: Deployments to restart
        id: targets
        run: |
          if ! names=$(kubectl -n "$NAMESPACE" get deployments -l "$SELECTOR" -o name 2>&1); then
            echo "$names"
            echo "::error::cannot list Deployments in ${NAMESPACE}. Prerequisites (knowledge#66): the namespace exists, it is in github_runner_deploy_namespaces, and this repository is in the elvira-k3s runner group."
            exit 1
          fi
          if [ -z "$names" ]; then
            echo "::error::no Deployment labelled ${SELECTOR} in ${NAMESPACE}: deploy the overlay first (knowledge#66)"
            exit 1
          fi
          echo "$names"
          { echo "names<<EOF"; echo "$names"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Restart onto the new :develop
        env:
          NAMES: ${{ steps.targets.outputs.names }}
        run: |
          # shellcheck disable=SC2086
          kubectl -n "$NAMESPACE" rollout restart $NAMES

      - name: Wait for the rollouts
        env:
          NAMES: ${{ steps.targets.outputs.names }}
        run: |
          for d in $NAMES; do
            kubectl -n "$NAMESPACE" rollout status "$d" --timeout="$TIMEOUT"
          done

      # :develop could have moved, or a pull could have failed silently onto a cached layer.
      # Pods still terminating are skipped. A newer push queues behind this job (concurrency).
      - name: Running pods use ${{ env.DIGEST }}
        run: |
          ids=$(kubectl -n "$NAMESPACE" get pods -l "$SELECTOR" \
            -o go-template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{range .status.initContainerStatuses}}{{.imageID}}{{"\n"}}{{end}}{{range .status.containerStatuses}}{{.imageID}}{{"\n"}}{{end}}{{end}}{{end}}')
          echo "$ids"
          test -n "$ids"
          if echo "$ids" | grep -v -- "@${DIGEST}\$"; then
            echo "::error::a running pod does not use ${DIGEST}"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          NAMES: ${{ steps.targets.outputs.names }}
        run: |
          {
            echo "### Deploy to ${NAMESPACE} (development)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Image | \`${IMAGE}:develop@${DIGEST}\` |"
            echo "| Deployments | $(echo "$NAMES" | tr '\n' ' ') |"
            echo "| Portal | http://portal.digitalizer.stu.k8s.internal (VPN) |"
          } >> "$GITHUB_STEP_SUMMARY"
