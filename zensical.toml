# Zensical static-site config — https://zensical.org
# Build:   zensical build --clean      (output -> ./site)
# Preview: zensical serve              (http://localhost:8000)
# Published to GitHub Pages by .github/workflows/docs.yml

[project]
site_name = "EvilFlowers Books Digitalizer"
site_description = """\
Portal and orchestrator for digitalizing scanned books: TIFF scans to Internet Archive \
compatible items (searchable PDF, PDF/A, EPUB), reviewed in a web studio, with optional \
catalog publishing."""
site_author = "Jakub Dubec"
site_url = "https://evilflowerscatalog.github.io/evilflowers-books-digitalizer/"
copyright = "&copy; EvilFlowers Catalog"

repo_url = "https://github.com/EvilFlowersCatalog/evilflowers-books-digitalizer"
repo_name = "EvilFlowersCatalog/evilflowers-books-digitalizer"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

nav = [
  { "Home" = "index.md" },
  { "Restoration Studio" = [
    "studio.md",
    "web_ui.md",
    "metadata.md",
  ] },
  { "Architecture & design" = [
    "architecture.md",
    "design/target-architecture.md",
    "design/studio-spec.md",
    "design/catalog-protocol-requests.md",
    "design/catalog-labelling-requests.md",
  ] },
  { "Run & operate" = [
    "testing.md",
    "deployment.md",
    "operations.md",
  ] },
  { "Archive" = [
    "archive/digitalization_pipeline_report.md",
    "archive/reflow_edition.md",
    "archive/metadata_and_covers.md",
    "archive/catalog_import.md",
  ] },
]

[project.theme]
variant = "modern"

features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "purple"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "purple"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to light mode"
