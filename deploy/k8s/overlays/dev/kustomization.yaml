# Dev overlay: the digitalizer on control (workload=apps), the DEV catalog as its optional
# publish target.
#
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/dev
#
# Render only; the cluster applies manifests through the Ansible role (knowledge#66,
# Cookbooks/Deploy-a-Service §2), never `kubectl apply` by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      elvira.stuba.sk/environment: development
    includeTemplates: true
    includeSelectors: false

images:
  # development runs :develop: every push to develop rolls it out (.github/workflows/docker.yml,
  # job deploy). Pin a build with: newTag: sha-<short> (CI's restart then pulls nothing new and
  # its digest check fails, which is the point of a pin).
  - name: ghcr.io/evilflowerscatalog/evilflowers-books-digitalizer
    newTag: develop

components:
  - ../../components/storage-root      # mounts follow STUDIO_STORAGE_ROOT below

configMapGenerator:
  - name: studio-env
    behavior: merge
    literals:
      - STUDIO_STORAGE_ROOT=/data         # where the pods mount the shared storage
      - DEPLOYMENT_ENVIRONMENT=development
      - EVILFLOWERS_LOG_LEVEL=DEBUG
      # no IMAGE_TAG: the image bakes <ref>@<sha> (Dockerfile ARG), the span's service.version
