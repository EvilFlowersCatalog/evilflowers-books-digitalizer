# studio-api: FastAPI (REST, SSE /api/v1/events, DZI tiles) + the SPA bundle.
# Pod template defaults (security, telemetry, secrets, mounts): pod-defaults.yaml.
#
# One replica, Recreate: the init container (pod-defaults.yaml) migrates the schema, and two API
# generations must never run against different schema revisions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  labels:
    app.kubernetes.io/name: studio-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: studio-api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-api
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 15
      # init container `migrate` (alembic upgrade head): pod-defaults.yaml, shared with the workers
      containers:
        - name: studio
          command:
            - uvicorn
            - evilflowers_books_digitalizer.studio.api.app:create_app
            - --factory
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
            - --forwarded-allow-ips=*
            - --timeout-graceful-shutdown=10   # SSE streams never end on their own
          env:
            - { name: STUDIO_ROLE, value: api }
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
---
# VPN-only, like flower: no HTTPRoute. Operators reach it through the k8s-stu router
# as http://studio.digitalizer.stu.k8s.internal (CoreDNS rewrites <svc>.<ns>).
apiVersion: v1
kind: Service
metadata:
  name: studio
  labels:
    app.kubernetes.io/name: studio-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: studio-api }
  ports:
    - { name: http, port: 80, targetPort: http }
