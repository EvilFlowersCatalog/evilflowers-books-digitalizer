# EXAMPLE ONLY: not listed in kustomization.yaml and never committed with values.
# The real Secret is created from 1Password (Ansible role, -e secrets_push=true), e.g.
#
#   kubectl -n digitalizer create secret generic studio-secrets \
#     --from-literal=database-url='postgresql+psycopg://digitalizer:<pw>@postgres.shared.svc.cluster.local:5432/digitalizer' \
#     --from-literal=redis-url='redis://redis.shared.svc.cluster.local:6379/8' \
#     --from-literal=evilflowers-api-key='<token>'
#
# postgres/redis are the selector-less Services in namespace `shared` that front the
# k8s-bridge on gateway (Proposals/Dev-Environment-K8s, D4). Redis db 8 = studio Celery.
apiVersion: v1
kind: Secret
metadata:
  name: studio-secrets
  namespace: digitalizer
type: Opaque
stringData:
  database-url: postgresql+psycopg://digitalizer:CHANGE_ME@postgres.shared.svc.cluster.local:5432/digitalizer
  redis-url: redis://redis.shared.svc.cluster.local:6379/8
  evilflowers-api-key: CHANGE_ME
