# Books digitalizer, kustomize base (docs/diagrams/deployment-digitalizer-dev).
#
# Render (the config lives in configs/, outside this directory, hence the flag):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/dev
#
# Two Deployments of one image: portal (API + SPA) and orchestrator (job ledger + beat).
# Prerequisites (not created here, knowledge#66): Secret studio-secrets
# (secret.example.yaml), Secret ghcr-pull, the gateway NFS exports, the `shared`
# postgres/valkey Services, and the service workers on Valkey db 8 (scan, ocr, analyzer,
# equation, render; their KEDA objects and the PriorityClass digitalizer-batch live with them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: digitalizer

labels:
  - pairs:
      app.kubernetes.io/part-of: elvira
      app.kubernetes.io/instance: digitalizer
      app.kubernetes.io/managed-by: ansible
    includeTemplates: true          # pods carry them too (Loki/Tempo filters)
    includeSelectors: false         # selectors are immutable; keep them minimal

resources:
  - namespace.yaml
  - storage.yaml
  - portal.yaml
  - orchestrator.yaml
  - nfs-server.yaml                 # local-config: not rendered, feeds `replacements`

# The NFS server address is set in one place (nfs-server.yaml) and copied into each PV.
replacements:
  - source: { kind: ConfigMap, name: nfs-server, fieldPath: data.server }
    targets:
      - select: { kind: PersistentVolume }
        fieldPaths: [spec.nfs.server]

configMapGenerator:
  - name: studio-config             # hash suffix: a config change rolls every pod
    files:
      - studio.toml=../../../configs/studio.k8s.toml
  - name: studio-env
    literals:
      - STUDIO_CONFIG=/etc/studio/studio.toml
      # the shared storage root; overlays change it and include components/storage-root,
      # which moves the raw-scans / digitized mounts under it
      - STUDIO_STORAGE_ROOT=/data
      - DEPLOYMENT_ENVIRONMENT=production
      - EVILFLOWERS_LOG_FORMAT=json
      - EVILFLOWERS_LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf

patches:
  - path: pod-defaults.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (api,orchestrator)
