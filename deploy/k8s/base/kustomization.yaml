# Restoration studio, kustomize base (docs/design/deployment-restoration-studio.puml).
#
# Render (the config lives in configs/, outside this directory, hence the flag):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/dev
#
# Prerequisites (not created here): Secret studio-secrets (secret.example.yaml),
# Secret ghcr-pull, the gateway NFS exports, and the `shared` postgres/redis Services.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: digitalizer

labels:
  - pairs:
      app.kubernetes.io/part-of: elvira
      app.kubernetes.io/instance: digitalizer-studio
    includeTemplates: true          # pods carry them too (Loki/Tempo filters)
    includeSelectors: false         # selectors are immutable; keep them minimal

resources:
  - namespace.yaml
  - storage.yaml
  - studio-api.yaml
  - workers.yaml
  - vlm.yaml
  - nfs-server.yaml                 # local-config: not rendered, feeds `replacements`

# The NFS server address is set in one place (nfs-server.yaml) and copied into each PV.
replacements:
  - source: { kind: ConfigMap, name: nfs-server, fieldPath: data.server }
    targets:
      - select: { kind: PersistentVolume }
        fieldPaths: [spec.nfs.server]

configMapGenerator:
  - name: studio-config             # hash suffix: a config change rolls every pod
    files:
      - studio.toml=../../../configs/studio.k8s.toml
  - name: studio-env
    literals:
      - STUDIO_CONFIG=/etc/studio/studio.toml
      - DEPLOYMENT_ENVIRONMENT=production
      - EVILFLOWERS_LOG_FORMAT=json
      - EVILFLOWERS_LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf

patches:
  - path: pod-defaults.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (api,worker)
