# Celery workers, one Deployment per pool (docs/design/studio-spec.md "Queues and tasks").
# Pod template defaults (security, telemetry, secrets, mounts): pod-defaults.yaml.
#
# Sizing: control has 6 vCPU / 32 GB and already hosts LGTM, TEI and CI, so requests
# stay small and limits cap the burst. Celery would size its pool from the HOST's
# cores (6), not the pod's limit, hence --concurrency is always explicit.
#
# Liveness: `celery inspect ping` against this worker's own node name. A prefork
# worker answers from its main process even while every child is busy, so a long
# page job never fails the probe; a wedged broker connection does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
  labels:
    app.kubernetes.io/name: studio-worker-cpu
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: studio-worker-cpu }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-worker-cpu
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120   # warm shutdown: let the current page finish
      containers:
        - name: studio
          # `interactive` first: operator re-runs jump the batch backlog.
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - -Q
            - interactive,cpu
            - -n
            - cpu@%h
            - --concurrency=3                # cores / 2 on control
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: OMP_THREAD_LIMIT, value: "1" }   # tesseract: one thread per pool process
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "cpu@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 1500m, memory: 3Gi }
            limits: { cpu: "4", memory: 8Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels:
    app.kubernetes.io/name: studio-worker-ai
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: studio-worker-ai }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-worker-ai
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: studio
          # studio.analyze (layout: DocLayout-YOLO ONNX, baked into the image at
          # /opt/evilflowers-tools/models/doclayout-yolo, [pipeline.layout] threads = 2) and
          # studio.formulas, which only CALLS the vlm Service over HTTP
          # ([pipeline.vlm] url): the model runs in the vlm Deployment, not here.
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - -Q
            - ai
            - -n
            - ai@%h
            - --concurrency=1                # models are memory-bound; one at a time
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: OMP_NUM_THREADS, value: "2" }    # = cpu limit; onnxruntime: [pipeline.layout] threads
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "ai@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi }
---
# worker-io also runs celery beat (embedded, --beat): exactly one replica and
# Recreate, or two beats would schedule every periodic task twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-io
  labels:
    app.kubernetes.io/name: studio-worker-io
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: studio-worker-io }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-worker-io
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: studio
          # discover, previews/tiles, publish, export: mostly waiting on NFS/HTTP.
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - --beat
            - --schedule=/tmp/celerybeat-schedule
            - -Q
            - io
            - -n
            - io@%h
            - --concurrency=4
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            # beat task studio.recover_runs (needs migration 0003, applied by the init container)
            - { name: STUDIO_RECOVER_INTERVAL_SECONDS, value: "300" }
            - { name: STUDIO_RECOVER_DISPATCH_GRACE_SECONDS, value: "300" }
            - { name: STUDIO_RECOVER_STALE_SECONDS, value: "1800" }
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "io@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { cpu: "1", memory: 2Gi }
