# Celery Deployments of the digitalizer (one image, the command decides the role).
# Pod template defaults (security, telemetry, secrets, mounts): pod-defaults.yaml.
#
# Who yields to whom, in three layers (docs/design/target-architecture.md §2):
#   1. admission  the orchestrator's pump sends bulk jobs only within the current capacity
#                 (peak hours narrow it, the catalog's backlog on Redis db 7 holds it, an
#                 operator can pause it): queues stay short, so KEDA scales to what is admitted;
#   2. scheduling bulk workers run under PriorityClass `digitalizer-batch` (below every
#                 default pod, never preempting): under node pressure the scheduler evicts them
#                 first; their jobs return to the queue (acks_late) and the ledger re-sends a
#                 job whose worker went silent (reconcile, stale heartbeat);
#   3. CPU        small requests, limits that cap the burst; Celery sizes its pool from the
#                 HOST's cores, so --concurrency is always explicit.
#
# Liveness: `celery inspect ping` against the worker's own node name. A prefork worker
# answers from its main process while every child is busy; a wedged broker does not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app.kubernetes.io/name: digitalizer-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  # beat runs embedded (-B): exactly one replica, Recreate, or the pump and reconcile
  # would be scheduled twice (both are safe to overlap, but twice is waste)
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: digitalizer-orchestrator }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digitalizer-orchestrator
        app.kubernetes.io/component: orchestrator
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: studio
          # runs, job_done/job_failed callbacks, pump, reconcile, discover, gate, publish:
          # light and mostly waiting on Postgres / NFS / the catalog API
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - --beat
            - --schedule=/tmp/celerybeat-schedule
            - -Q
            - digitalizer.portal
            - -n
            - orchestrator@%h
            - --concurrency=4
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: DIGITALIZER_PUMP_INTERVAL_SECONDS, value: "15" }
            - { name: DIGITALIZER_RECONCILE_INTERVAL_SECONDS, value: "60" }
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "orchestrator@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { cpu: "1", memory: 2Gi }
---
# Operator re-runs: always one replica, normal priority, so a page re-run never waits
# for a bulk worker to scale up or to finish a chunk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-interactive
  labels:
    app.kubernetes.io/name: digitalizer-worker-interactive
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: digitalizer-worker-interactive }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digitalizer-worker-interactive
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: studio
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - -Q
            - digitalizer.interactive
            - -n
            - interactive@%h
            - --concurrency=2
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: OMP_THREAD_LIMIT, value: "1" }   # tesseract: one thread per pool process
            - { name: OMP_NUM_THREADS, value: "2" }    # onnxruntime layout: [pipeline.layout] threads
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "interactive@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi }
---
# Bulk: in-process clean / render (until evilflowers-scan-service / -render-service take
# them, docs/design/target-architecture.md §3). Scaled 0..N by KEDA on the queue's length
# (overlay); the pump keeps that length at what admission allows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
  labels:
    app.kubernetes.io/name: digitalizer-worker-cpu
    app.kubernetes.io/component: worker
spec:
  replicas: 0                            # KEDA owns the count (keda.yaml in the overlay)
  selector:
    matchLabels: { app.kubernetes.io/name: digitalizer-worker-cpu }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digitalizer-worker-cpu
        app.kubernetes.io/component: worker
    spec:
      priorityClassName: digitalizer-batch
      # warm shutdown on scale-in: the current chunk finishes; past the grace period the
      # job returns to the queue (acks_late) and runs again under the same token
      terminationGracePeriodSeconds: 600
      containers:
        - name: studio
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - -Q
            - digitalizer.cpu
            - -n
            - cpu@%h
            - --concurrency=2
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: OMP_THREAD_LIMIT, value: "1" }
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "cpu@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi }
---
# Bulk: in-process layout / formulas (until analyzer- / equation-service standalone tasks).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels:
    app.kubernetes.io/name: digitalizer-worker-ai
    app.kubernetes.io/component: worker
spec:
  replicas: 0                            # KEDA owns the count (keda.yaml in the overlay)
  selector:
    matchLabels: { app.kubernetes.io/name: digitalizer-worker-ai }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digitalizer-worker-ai
        app.kubernetes.io/component: worker
    spec:
      priorityClassName: digitalizer-batch
      terminationGracePeriodSeconds: 600
      containers:
        - name: studio
          # layout: DocLayout-YOLO ONNX baked into the image; formulas only CALL the shared
          # vlm (PaddleOCR-VL, namespace shared, knowledge#67) over HTTP
          command:
            - celery
            - -A
            - evilflowers_books_digitalizer.studio.workers.app:celery
            - worker
            - -Q
            - digitalizer.ai
            - -n
            - ai@%h
            - --concurrency=1                # models are memory-bound; one at a time
            - --prefetch-multiplier=1
            - -O
            - fair
            - --loglevel=INFO
          env:
            - { name: OMP_NUM_THREADS, value: "2" }    # = cpu limit; [pipeline.layout] threads
          livenessProbe:
            exec:
              command: [sh, -c, 'celery -A evilflowers_books_digitalizer.studio.workers.app:celery inspect ping -d "ai@$HOSTNAME" --timeout 10 >/dev/null']
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi }
