# Local development stack for the restoration studio (Postgres 18 + Redis).
#
#   docker compose -f deploy/dev/compose.yml up -d
#   export STUDIO_DATABASE_URL=postgresql+psycopg://studio:studio@127.0.0.1:55432/studio
#   export STUDIO_REDIS_URL=redis://127.0.0.1:56379/0
#
# Non-default host ports so it never collides with a local Postgres/Redis.
name: evilflowers-studio-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
