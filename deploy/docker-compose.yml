# Run the batch in the toolchain container (scantailor-cli, tesseract, recode_pdf
# are baked into the image). Copy .env.example -> .env and adjust paths.
#
#   docker compose -f deploy/docker-compose.yml run --rm digitizer check      # preflight
#   docker compose -f deploy/docker-compose.yml up -d --build digitizer       # start the run
#   docker compose -f deploy/docker-compose.yml logs -f digitizer             # follow logs
#   docker compose -f deploy/docker-compose.yml exec digitizer \
#       evilflowers-digitalizer monitor                                       # TUI dashboard
#
# It's a plain long-running process — no database, no server.
#
# Config: the image reads $EVILFLOWERS_DIGITALIZER_CONFIG (no --config needed).
# Here it is configs/pipeline.toml mounted at /app/configs; its relative paths
# ("../output", "../.cache") resolve against /app/configs, i.e. to the
# /app/output and /app/.cache mounts below. The container runs as a non-root
# uid (DIGITALIZER_UID), which must be able to write OUTPUT_DIR and CACHE_DIR.

name: evilflowers-digitalizer

services:
  digitizer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: evilflowers-digitalizer:latest
    user: "${DIGITALIZER_UID:-10001}:${DIGITALIZER_GID:-0}"
    command: ["evilflowers-digitalizer", "run-corpus"]
    environment:
      - EVILFLOWERS_DIGITALIZER_CONFIG=/app/configs/pipeline.toml
      - EVILFLOWERS_LOG_FORMAT=${EVILFLOWERS_LOG_FORMAT:-text}
      - EVILFLOWERS_LOG_LEVEL=${EVILFLOWERS_LOG_LEVEL:-INFO}
      # Catalog import API key (publish-* and --publish); blank disables publishing.
      - EVILFLOWERS_API_KEY=${EVILFLOWERS_API_KEY:-}
    volumes:
      - ${RAW_SCANS_MOUNT:-/mnt/digital-library/raw-scans}:/mnt/digital-library/raw-scans:ro
      - ../configs:/app/configs:ro
      - ${OUTPUT_DIR:-../output}:/app/output
      - ${CACHE_DIR:-../.cache}:/app/.cache
    restart: on-failure

  # One-shot catalog import: `docker compose run --rm publish`. Reuses the same
  # image, config and output volume as the digitizer.
  publish:
    extends: digitizer
    command: ["evilflowers-digitalizer", "publish-catalog"]
    restart: "no"
