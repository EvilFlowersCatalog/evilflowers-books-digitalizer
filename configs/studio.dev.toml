# Restoration studio — local development config (dev stack: deploy/dev/compose.yml).
#
#   docker compose -f deploy/dev/compose.yml up -d
#   STUDIO_CONFIG=configs/studio.dev.toml evilflowers-digitalizer studio …
#
# Relative paths resolve against this file's directory. Every digitalization stage runs on a
# service (scan, ocr, analyzer, equation, render: evilflowers-books-digitalizer#6): run those
# workers locally on the same Redis with STORAGE_PATH pointing at the storage root below, or
# only the API and the orchestrator to work on the portal itself.

[studio]
database_url = "postgresql+psycopg://studio:studio@127.0.0.1:55432/studio"
redis_url = "redis://127.0.0.1:56379/0"
# the services' STORAGE_PATH: scans and artifacts must live below it
storage_root = "../.data"
artifacts_root = "{storage_root}/digitized/studio"
cache_dir = "../.cache/studio"

[projects.stu-local]
name = "STU (local synthetic scans)"
scans_root = "{storage_root}/raw-scans"
book_pattern = "{collection}/{book}"
frames_glob = "*.tif"
item_id = "stu-{collection}-{book}"
language = "slk"
ocr_language = "slk+eng"
outputs = ["pdf", "pdfa", "epub"]
auto_publish = "never"

[projects.stu-local.collections]
fei = "Fakulta elektrotechniky a informatiky STU"

[projects.stu-local.publish]
target = "none"

[projects.stu-local.pipeline.scantailor]   # sent to scan-service with every clean job
color_mode = "mixed"
margins_mm = 8.0
dpi = 300
output_dpi = 600

# The decision services are cluster-only (namespace shared). Without them scan marks stay
# "review" (#14) and nothing is prefilled from the title page (#15).
# [decider]
# url = "http://127.0.0.1:8081/v1/systemone"
# vision_url = "http://127.0.0.1:8082/v1/systemone"
