# Restoration studio — k8s config (namespace digitalizer; deploy/k8s).
#
# Shipped as the ConfigMap `studio-config`, mounted at /etc/studio/studio.toml
# ($STUDIO_CONFIG). Every path is ABSOLUTE: relative ones would resolve against
# /etc/studio, a read-only ConfigMap mount.
#
# Pod mounts (deploy/k8s), under the storage root $STUDIO_STORAGE_ROOT (set once per overlay,
# default /data; kustomize derives the mount paths from it):
#   {storage_root}/raw-scans   NFS gateway:/mnt/digital-library/raw-scans   read-only (export ro)
#   {storage_root}/digitized   NFS gateway:/mnt/digital-library/digitized   rw
#   /scratch                   local-path PVC on the workload node          rw (renditions cache)
#
# Secrets come from the environment, never from this file:
#   STUDIO_DATABASE_URL  postgresql+psycopg://digitalizer:…@postgres.shared.svc.cluster.local:5432/digitalizer
#   STUDIO_REDIS_URL     redis://valkey.shared.svc.cluster.local:6379/8  (Celery db 8, Valkey)
#   EVILFLOWERS_API_KEY  catalog token ([projects.stu.publish].api_key_env)

[studio]
# Only used when the env vars above are missing (e.g. a local `kubectl run` debug pod).
database_url = "postgresql+psycopg://digitalizer@postgres.shared.svc.cluster.local:5432/digitalizer"
# The broker is Valkey in namespace shared (Redis protocol, #8). The catalog's queues
# ([[scheduling.backpressure]] below) stay on gateway's Redis db 7.
redis_url = "redis://valkey.shared.svc.cluster.local:6379/8"
# The shared storage root: it holds raw-scans/ and digitized/. Service jobs carry paths
# relative to it, so a service may mount the same storage elsewhere (its own STORAGE_PATH);
# only the layout below the root must match. $STUDIO_STORAGE_ROOT (studio-env) overrides it.
storage_root = "/data"
# IA item layout: {storage_root}/digitized/studio/<project>/<item_id>/<item_id>.pdf …
# Its own subtree, so it never mixes with the legacy batch's digitized/{dev,prod}.
artifacts_root = "{storage_root}/digitized/studio"
cache_dir = "/scratch/cache"

[orchestration]
budget = 2                             # re-sends of a lost job before its run fails
stale_after_seconds = 600              # a local job silent this long: its worker is gone
# Every digitalization stage runs on a service on Valkey db 8 (evilflowers-books-digitalizer#6;
# knowledge#66 deploys them). The defaults (studio.config DEFAULT_ROUTES) are the services'
# own task names and queues; a table below overrides single fields:
#   clean     evilflowers_scan.clean                        evilflowers_scan.standalone[.interactive]
#   analyze   evilflowers_ocr_worker.standalone.hocr        evilflowers_ocr_worker.standalone[.interactive]
#           ∥ evilflowers_analyzer.standalone.layout        evilflowers_analyzer.standalone[.interactive]
#           + evilflowers_scan.erase (confirmed "remove" boxes only)
#   formulas  evilflowers_equation.standalone.formulas      evilflowers_equation.standalone[.interactive]
#   render    evilflowers_render.book                       evilflowers_render.standalone
# Batches: 32 leaves per bulk job, 1 per operator re-run job.
[orchestration.stages.analyze]
deadline_seconds = 3600                # also erase's: scan-service's hard limit is 3300 s
[orchestration.stages.formulas]
deadline_seconds = 14400               # a page of formulas can take minutes on CPU
[orchestration.stages.render]
deadline_seconds = 28800               # a long book; render is an off-peak stage anyway

[decider]
# knowledge#77 admits namespace digitalizer and sets DECIDER_URL / DECIDER_VISION_URL /
# DECIDER_TIMEOUT on the orchestrator (they win over these). Until it is applied the calls time
# out and both uses fall back: marks stay "review" (#14), no title-page prefill (#15).
url = "http://decider.shared.svc.cluster.local/v1/systemone"
vision_url = "http://decider-vision.shared.svc.cluster.local/v1/systemone"
timeout = 60

[marks]                                # scan marks grouped across a book (#14)
min_leaves = 3                         # = scan-service artefact_min_repeats
hash_distance = 6                      # = scan-service artefact_hash_distance
# hide_above / keep_above: none until knowledge#65 calibrates scan_mark

[scheduling]
# Book digitalization is background work: full width at night and at weekends, narrow during
# the working day, held while the catalog's own extraction has a backlog. Operator re-runs
# (interactive lane) are never held. Admission only decides what is SENT: a running job is
# never interrupted, so render (a whole book) waits for off-peak.
timezone = "Europe/Bratislava"
peak_hours = ["mon-fri 07:00-19:00"]
bulk_inflight = 6
bulk_inflight_peak = 1
bulk_inflight_contended = 0
interactive_inflight = 4
off_peak_stages = ["render"]
[scheduling.queue_inflight]
# = render-service's replica maximum (one book per pod). A render job's deadline runs from
# dispatch, so a book left waiting in the queue would use up its 8 h before a worker starts it.
"evilflowers_render.standalone" = 1
[[scheduling.backpressure]]
# The catalog's extraction and OCR workers on Redis db 7 (knowledge Extraction-Pipeline):
# a backlog there means the catalog needs the cluster more than a book's digitalization.
name = "catalog-extraction"
redis_url = "redis://redis.shared.svc.cluster.local:6379/7"
queues = ["evilflowers_analyzer", "evilflowers_image", "evilflowers_equation",
          "evilflowers_text_worker", "evilflowers.text.paragraphs", "evilflowers.text.tables",
          "evilflowers_ocr_worker"]
max_depth = 20

[projects.stu]
name = "STU — Slovak University of Technology"
scans_root = "{storage_root}/raw-scans"
# Real tree (Cookbooks/Digitalizer): raw-scans/<faculty>/<FACULTY>-skeny/<book>/stream_pages_tif/*.tif
book_pattern = "{collection}/*-skeny/{book}"
frames_glob = "stream_pages_tif/*.tif"
item_id = "stu-{collection}-{book}"
language = "slk"                       # MARC code (IA `language`)
ocr_language = "slk+eng"               # sent to ocr-service with every leaf
outputs = ["pdf", "pdfa", "epub"]      # what render-service makes
auto_publish = "review"                # real corpus: a human approves before anything goes public

[projects.stu.collections]
fad = "Fakulta architektúry a dizajnu STU"
fei = "Fakulta elektrotechniky a informatiky STU"
mtf = "Materiálovotechnologická fakulta STU"
sjf = "Strojnícka fakulta STU"
svf = "Stavebná fakulta STU"

[projects.stu.metadata]
# Excel (catalog.xlsx) needs an extra mount; OPAC lookup works from the pod as is.
providers = ["opac"]

[projects.stu.publish]
# Publication is optional: target = "none" (or no [publish]) ends a book in `approved`
# with its files (PDF, PDF/A-2b, EPUB, IA item) on the digitized export.
target = "evilflowers"
# Dev catalog (Cookbooks/Digitalizer §2). Switch to the prod API once its host and
# a prod API key exist; the knowledge base names no prod API URL yet.
base_url = "https://dev.evilflowers.elvira.stuba.sk/api/v1"
api_key_env = "EVILFLOWERS_API_KEY"
catalog = "{collection}"               # one catalog per faculty: fad fei mtf sjf svf
# Publishing UPLOADS copies to the catalog. No files_base_url: the catalog API cannot
# create external_url acquisitions yet, and a project that sets it fails fast
# (docs/design/catalog-protocol-requests.md). In-place publishing waits for that change.

[projects.stu.quality]
min_ocr_conf = 80.0

[projects.stu.pipeline.scantailor]    # sent to scan-service with every clean job (scan-service#3)
color_mode = "mixed"
margins_mm = 8.0
dpi = 300
output_dpi = 600
