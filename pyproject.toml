[project]
name = "evilflowers-books-digitalizer"
version = "0.1.0"
description = "Book digitalizer: portal + orchestration + lab for scanned books (TIFF scans -> restored pages, searchable PDF/A, EPUB, IA items)"
authors = [{ name = "Jakub Dubec", email = "jdubec@culturepulse.ai" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
# The portal image: API + orchestrator. No OCR, layout, formula, cleaning or rendering engine:
# those run on the services (evilflowers-books-digitalizer#6).
dependencies = [
    "pillow (>=11.0,<12.0)",
    "pydantic (>=2.0,<3.0)",
    # leaf planning (spread detection on the raw frames): the orchestrator's only pixel work
    "opencv-python-headless (>=4.10,<5.0)",
    # Excel metadata provider ([projects.X.metadata] excel_path)
    "pandas (>=2.2,<3.0)",
    "openpyxl (>=3.1,<4.0)",
    # studio database + migrations (Postgres in deployments; any SQLAlchemy URL).
    # <2.1 until opentelemetry-instrumentation-sqlalchemy supports 2.1 (0.66b2: "< 2.1.0";
    # on 2.1 it refuses to instrument and also needs greenlet): no SQL spans otherwise (#13)
    "sqlalchemy (>=2.0.44,<2.1)",
    "alembic (>=1.13,<2.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    # restoration studio: job queue + event bus
    "celery[redis] (>=5.4,<6.0)",
    "redis (>=5.0,<7.0)",
    # restoration studio API (REST + SSE + Deep Zoom) and its PDF page renditions
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.30,<1.0)",
    "pypdfium2 (>=4.30,<6.0)",
    # HTTP clients: the decision services (#14, #15) and the labelling source (#7)
    "httpx (>=0.28,<1.0)",
    # hOCR: the IA text documents and the title-page lines (#15)
    "lxml (>=5.0,<7.0)",
    # EvilFlowers Catalog REST client (studio/adapters/catalog). Not on PyPI: the
    # source is pinned in [tool.poetry.dependencies] below; the Docker image
    # installs it from git first (see Dockerfile, PROTOCOL_REF).
    "evilflowers-protocol (>=0.2.0,<0.3.0)",
    # GET /metrics (ledger gauges, served by the orchestrator: studio/ledger_metrics.py)
    "prometheus-client (>=0.20,<1.0)",
    "mcp (>=1.20,<2)",
]

[project.optional-dependencies]
# OpenTelemetry (studio/telemetry.py): a no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
# The image installs it (`pip install ".[telemetry]"`); tests and laptops need not.
telemetry = [
    "opentelemetry-sdk (>=1.30,<2.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.30,<2.0)",
    "opentelemetry-instrumentation-celery (>=0.51b0,<1.0)",
    "opentelemetry-instrumentation-fastapi (>=0.51b0,<1.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.51b0,<1.0)",
    "opentelemetry-instrumentation-redis (>=0.51b0,<1.0)",
    "opentelemetry-instrumentation-httpx (>=0.51b0,<1.0)",
    "opentelemetry-instrumentation-requests (>=0.51b0,<1.0)",
]

[project.scripts]
evilflowers-digitalizer = "evilflowers_books_digitalizer.cli:main"

[tool.poetry]
packages = [{ include = "evilflowers_books_digitalizer" }]
include = [
    { path = "evilflowers_books_digitalizer/db/migrations/script.py.mako", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
# Pinned to the same commit as PROTOCOL_REF in the Dockerfile; bump both together.
# For local development against a sibling checkout, temporarily use:
# evilflowers-protocol = { path = "../evilflowers-protocol-python", develop = true }
evilflowers-protocol = { git = "https://github.com/EvilFlowersCatalog/evilflowers-protocol-python.git", rev = "62c05d7650381bfcc3dd8ebeb0d733fc9c83e494" }

# lab/ (notebooks, experiments): not in the image. The notebooks drive the retired batch
# pipeline: run them on commit c94a858 (lab/README.md).
[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyterlab = "^4.0"
matplotlib = "^3.9"
plotly = "^6.8.0"
ipywidgets = "^8.1.8"
doxapy = "^0.9.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
mypy = "^1.14"
pytest = "^8.0"
pytest-cov = "^6.0"
# tests/studio/publish/test_ia_pdf_tools_compat.py: our scandata.xml read by IA's own tools
archive-pdf-tools = ">=1.5,<2"

# Docs site (Zensical — https://zensical.org). Install with: poetry install --with docs
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = ">=0.0.46"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# needed to read evilflowers_protocol's generated `Field(None, ...)` defaults correctly
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# The orchestration core is held to a higher bar.
[[tool.mypy.overrides]]
module = ["evilflowers_books_digitalizer.studio.orchestration.*",
          "evilflowers_books_digitalizer.studio.marks",
          "evilflowers_books_digitalizer.studio.title_page"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration tests need the dev stack (Postgres, Redis): opt in with `pytest -m integration`
addopts = "-q -m 'not integration'"
markers = ["integration: needs the dev stack (Postgres, Redis)"]

[tool.coverage.run]
branch = true
source = ["evilflowers_books_digitalizer"]
omit = [
    "*/__main__.py",
    "*/lab/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
