[project]
name = "evilflowers-books-digitalizer"
version = "0.1.0"
description = "Digitalization pipeline for scanned books: WebDAV TIFF scans -> searchable PDF/A, with enrichment and classification stages"
authors = [{ name = "Jakub Dubec", email = "jdubec@culturepulse.ai" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "webdav4 (>=0.10,<1.0)",
    "ocrmypdf (>=17.0,<18.0)",
    "img2pdf (>=0.6,<1.0)",
    "pikepdf (>=10.0,<11.0)",
    "pillow (>=11.0,<12.0)",
    "pydantic (>=2.0,<3.0)",
    "tqdm (>=4.66,<5.0)",
    "opencv-python-headless (>=4.10,<5.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "archive-pdf-tools (>=1.5,<2)",
    "pandas (>=2.2,<3.0)",
    "openpyxl (>=3.1,<4.0)",
    "rich (>=13,<15)",
    # processing database + migrations (SQLite default; any SQLAlchemy URL)
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    # restoration studio: job queue + event bus
    "celery[redis] (>=5.4,<6.0)",
    "redis (>=5.0,<7.0)",
    # restoration studio API (REST + SSE + Deep Zoom) and its PDF page renditions
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.30,<1.0)",
    "pypdfium2 (>=4.30,<6.0)",
    # restoration studio: HTTP client for the CPU formula (VLM) service
    "httpx (>=0.28,<1.0)",
    # restoration studio: DocLayout-YOLO layout detector (ONNX, CPU; no torch/pickle)
    "onnxruntime (>=1.31,<2.0)",
    # reflow edition: hOCR parsing (pandoc / potrace / hunspell are system tools)
    "lxml (>=5.0,<7.0)",
    # EvilFlowers Catalog REST client (catalog/publisher.py). Not on PyPI: the
    # source is pinned in [tool.poetry.dependencies] below; the Docker image
    # installs it from git first (see Dockerfile, PROTOCOL_REF).
    "evilflowers-protocol (>=0.2.0,<0.3.0)",
]

[project.optional-dependencies]

[project.scripts]
evilflowers-digitalizer = "evilflowers_books_digitalizer.cli:main"

[tool.poetry]
packages = [{ include = "evilflowers_books_digitalizer" }]
include = [
    { path = "evilflowers_books_digitalizer/covers/assets/fonts/*.ttf", format = ["sdist", "wheel"] },
    { path = "evilflowers_books_digitalizer/covers/assets/logos/*.png", format = ["sdist", "wheel"] },
    { path = "evilflowers_books_digitalizer/db/migrations/script.py.mako", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
# Pinned to the same commit as PROTOCOL_REF in the Dockerfile; bump both together.
# For local development against a sibling checkout, temporarily use:
# evilflowers-protocol = { path = "../evilflowers-protocol-python", develop = true }
evilflowers-protocol = { git = "https://github.com/EvilFlowersCatalog/evilflowers-protocol-python.git", rev = "62c05d7650381bfcc3dd8ebeb0d733fc9c83e494" }

[tool.poetry.group.notebooks.dependencies]
jupyterlab = "^4.0"
matplotlib = "^3.9"
plotly = "^6.8.0"
ipywidgets = "^8.1.8"
doxapy = "^0.9.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
mypy = "^1.14"
pytest = "^8.0"
pytest-cov = "^6.0"

# Docs site (Zensical — https://zensical.org). Install with: poetry install --with docs
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = ">=0.0.46"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# needed to read evilflowers_protocol's generated `Field(None, ...)` defaults correctly
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# The pipeline package is held to a higher bar (it's the refactored core).
[[tool.mypy.overrides]]
module = "evilflowers_books_digitalizer.pipeline.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration tests run real tools (ScanTailor, recode_pdf) or the dev stack: opt in
# with `pytest -m integration`
addopts = "-q -m 'not integration'"
markers = ["integration: needs real tools (ScanTailor, Tesseract, recode_pdf) or the dev stack"]

[tool.coverage.run]
branch = true
source = ["evilflowers_books_digitalizer"]
omit = [
    "*/__main__.py",
    "*/notebooks/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
